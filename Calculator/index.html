<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <h1 style="color: white; text-align: center; padding: 30px; font-size: 60px;">CALCULATOR</h1>
    <!-- main -->
    <div class="main">
      <!-- Section-1 -->
      <!-- input -->
      <div id="inp-T">
        <input type="text" name="" placeholder="0"  id="input"/>
      </div>
      <div id="btns">
        <div id="box-1">
          <button onclick="calculate('AC')" id="AC">AC</button>
          <button onclick="calculate('%')">%</button>
          <button onclick="calculate('/')">/</button>
          <button onclick="calculate('x')">x</button>
        </div>
        <div id="box-2">
          <button onclick="calculate('7')">7</button>
          <button onclick="calculate('8')">8</button>
          <button onclick="calculate('9')">9</button>
          <button onclick="calculate('-')">-</button>
        </div>
        <div id="box-3">
          <button onclick="calculate('4')">4</button>
          <button onclick="calculate('5')">5</button>
          <button onclick="calculate('6')">6</button>
          <button onclick="calculate('+')">+</button>
        </div>
        <div id="box-4">

          <button onclick="calculate('1')">1</button>
          <button onclick="calculate('2')">2</button>
          <button onclick="calculate('3')">3</button>
          
        </div>

        <div id="box-5">
          <button onclick="calculate('0')" id="zero">0</button>
          <button onclick="calculate('.')">.</button>
            <button onclick="calculate('Del')">Del</button>
           <button onclick="calculate('=')" id="equal">=</button>

        </div> 
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
